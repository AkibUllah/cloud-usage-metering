services:
  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      ENVIRONMENT: development
      DATABASE_URL: postgresql+psycopg://metering:metering@db:5432/metering
      DEFAULT_CURRENCY: BDT
      RATING_GRANULARITY: hour
      # API_KEY: set-me-to-require-X-API-Key
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: metering
      POSTGRES_PASSWORD: metering
      POSTGRES_DB: metering
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U metering -d metering"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
